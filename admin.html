<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administração — Painel TV</title>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0b1220;
      color: #ffffff;
    }

    .hidden {
      display: none !important;
    }


    /* =========================
       LOGIN
    ========================= */

    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(
        circle at top,
        #123b69 0%,
        #0b1220 55%
      );
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #111c2e;
      border: 1px solid #243754;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .login-logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .login-box h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 25px;
    }

    .login-box p {
      text-align: center;
      color: #91a4bd;
      margin: 0 0 30px;
    }


    /* =========================
       FORMULÁRIOS
    ========================= */

    label {
      display: block;
      margin-bottom: 7px;
      color: #b9c8dc;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #31445f;
      background: #0b1525;
      color: #ffffff;
      border-radius: 8px;
      padding: 12px;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #1597ff;
      box-shadow: 0 0 0 2px rgba(21, 151, 255, 0.15);
    }

    .form-group {
      margin-bottom: 18px;
    }


    /* =========================
       BOTÕES
    ========================= */

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: #087fdb;
      color: white;
    }

    .btn-success {
      background: #16a36a;
      color: white;
    }

    .btn-danger {
      background: #c83b48;
      color: white;
    }

    .btn-secondary {
      background: #27374f;
      color: white;
    }

    .full {
      width: 100%;
    }

    .error {
      color: #ff6978;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }


    /* =========================
       ADMIN
    ========================= */

    #admin-screen {
      min-height: 100vh;
    }

    header {
      height: 70px;
      background: #101b2c;
      border-bottom: 1px solid #243754;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title span {
      font-size: 27px;
    }

    .header-title h1 {
      margin: 0;
      font-size: 20px;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-email {
      color: #9eb0c7;
      font-size: 13px;
    }

    main {
      width: 100%;
      max-width: 1400px;
      margin: auto;
      padding: 30px;
    }


    /* =========================
       SEÇÕES
    ========================= */

    .section {
      background: #111c2e;
      border: 1px solid #243754;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      gap: 15px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .section-description {
      color: #8497b1;
      font-size: 13px;
      margin-top: 5px;
    }


    /* =========================
       CONFIGURAÇÕES
    ========================= */

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .settings-grid .wide {
      grid-column: 1 / -1;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .switch-row {
      display: flex;
      gap: 30px;
      align-items: center;
      margin-top: 8px;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #d6e1ef;
    }

    .switch input {
      width: 18px;
      height: 18px;
      accent-color: #1597ff;
    }


    /* =========================
       TELAS
    ========================= */

    .screen-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .screen-row {
      background: #0b1525;
      border: 1px solid #263953;
      border-radius: 10px;
      padding: 15px;
      display: grid;
      grid-template-columns:
        60px
        1.2fr
        2fr
        100px
        100px
        90px;
      gap: 12px;
      align-items: center;
    }

    .screen-row.inactive {
      opacity: 0.5;
    }

    .screen-order {
      font-size: 20px;
      font-weight: 800;
      color: #1597ff;
      text-align: center;
    }

    .screen-field label {
      font-size: 11px;
      margin-bottom: 4px;
      color: #7489a5;
    }

    .screen-field input {
      padding: 9px;
      font-size: 13px;
    }

    .status-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-box input {
      width: 17px;
      height: 17px;
      accent-color: #16a36a;
    }

    .screen-actions {
      display: flex;
      justify-content: flex-end;
    }

    .screen-actions button {
      padding: 8px 11px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #71849f;
    }


    /* =========================
       RODAPÉ / STATUS
    ========================= */

    .bottom-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    #status-message {
      position: fixed;
      right: 25px;
      bottom: 25px;
      padding: 14px 18px;
      border-radius: 8px;
      background: #16263c;
      border: 1px solid #2d4563;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      z-index: 999;
      font-size: 14px;
    }

    #status-message.success {
      border-color: #16a36a;
    }

    #status-message.error-status {
      border-color: #c83b48;
    }


    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 1050px) {

      .screen-row {
        grid-template-columns:
          50px
          1fr
          1fr;
      }

      .screen-row > .screen-field:nth-child(4),
      .screen-row > .screen-field:nth-child(5),
      .screen-row > .status-box,
      .screen-row > .screen-actions {
        grid-column: span 1;
      }

    }


    @media (max-width: 700px) {

      header {
        padding: 0 15px;
      }

      .user-email {
        display: none;
      }

      main {
        padding: 15px;
      }

      .settings-grid {
        grid-template-columns: 1fr;
      }

      .settings-grid .wide {
        grid-column: auto;
      }

      .screen-row {
        grid-template-columns: 1fr;
      }

      .screen-order {
        text-align: left;
      }

      .screen-actions {
        justify-content: flex-start;
      }

      .bottom-actions {
        flex-direction: column;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       LOGIN
  ========================================================= -->

  <div id="login-screen">

    <div class="login-box">

      <div class="login-logo">
        📺
      </div>

      <h1>
        Painel TV
      </h1>

      <p>
        Área administrativa
      </p>


      <form id="login-form">

        <div class="form-group">

          <label for="email">
            E-mail
          </label>

          <input
            type="email"
            id="email"
            placeholder="Digite seu e-mail"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Senha
          </label>

          <input
            type="password"
            id="password"
            placeholder="Digite sua senha"
            required
          >

        </div>


        <button
          type="submit"
          class="btn-primary full"
          id="login-button">
          ENTRAR
        </button>


        <div
          id="login-error"
          class="error hidden">
        </div>

      </form>

    </div>

  </div>



  <!-- =========================================================
       ADMIN
  ========================================================= -->

  <div
    id="admin-screen"
    class="hidden">

    <header>

      <div class="header-title">

        <span>
          📺
        </span>

        <h1>
          Administração do Painel TV
        </h1>

      </div>


      <div class="header-user">

        <span
          id="user-email"
          class="user-email">
        </span>

        <button
          id="logout-button"
          class="btn-secondary">
          Sair
        </button>

      </div>

    </header>


    <main>


      <!-- =====================================================
           CONFIGURAÇÕES
      ===================================================== -->

      <section class="section">

        <div class="section-header">

          <div>

            <h2>
              ⚙️ Configurações da TV
            </h2>

            <div class="section-description">
              Controle o comportamento geral do painel.
            </div>

          </div>

        </div>


        <div class="settings-grid">


          <!-- INTERVALO -->

          <div class="form-group">

            <label for="intervalo">
              Tempo de cada tela (segundos)
            </label>

            <input
              type="number"
              id="intervalo"
              min="5"
              value="150"
            >

          </div>


          <!-- RELOAD -->

          <div class="form-group">

            <label for="reload">
              Recarregar painel a cada (horas)
            </label>

            <input
              type="number"
              id="reload"
              min="1"
              value="4"
            >

          </div>


          <!-- MENSAGEM -->

          <div class="form-group wide">

            <label for="mensagem">
              Mensagem da barra inferior
            </label>

            <textarea
              id="mensagem"
              placeholder="Digite a mensagem que aparecerá na TV..."
            ></textarea>

          </div>


          <!-- ELEMENTOS -->

          <div class="wide">

            <label>
              Elementos da TV
            </label>

            <div class="switch-row">


              <label class="switch">

                <input
                  type="checkbox"
                  id="calendario"
                >

                <span>
                  📅 Calendário
                </span>

              </label>


              <label class="switch">

                <input
                  type="checkbox"
                  id="relogio"
                >

                <span>
                  🕐 Relógio
                </span>

              </label>


            </div>

          </div>


        </div>


        <div class="bottom-actions">

          <button
            class="btn-success"
            id="save-settings">

            💾 SALVAR CONFIGURAÇÕES

          </button>

        </div>

      </section>



      <!-- =====================================================
           TELAS POWER BI
      ===================================================== -->

      <section class="section">

        <div class="section-header">

          <div>

            <h2>
              📊 Telas Power BI
            </h2>

            <div class="section-description">
              Gerencie as páginas exibidas na TV.
            </div>

          </div>


          <button
            class="btn-primary"
            id="add-screen">

            + ADICIONAR TELA

          </button>

        </div>


        <div
          id="screen-list"
          class="screen-list">

          <div class="empty">
            Carregando telas...
          </div>

        </div>


        <div class="bottom-actions">

          <button
            class="btn-success"
            id="save-screens">

            💾 SALVAR TELAS

          </button>

        </div>

      </section>


    </main>


    <div
      id="status-message"
      class="hidden">
    </div>

  </div>



  <script>


    /* ==========================================================
       SUPABASE
    ========================================================== */

    const SUPABASE_URL =
      "https://rgfcgdbtzsmidxllfqpx.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_dLvwDfNc_0D3kykWgus6sg_9ssB5Ng2";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ==========================================================
       ELEMENTOS
    ========================================================== */

    const loginScreen =
      document.getElementById("login-screen");

    const adminScreen =
      document.getElementById("admin-screen");

    const loginForm =
      document.getElementById("login-form");

    const loginButton =
      document.getElementById("login-button");

    const loginError =
      document.getElementById("login-error");

    const logoutButton =
      document.getElementById("logout-button");

    const userEmail =
      document.getElementById("user-email");

    const screenList =
      document.getElementById("screen-list");

    const statusMessage =
      document.getElementById("status-message");


    /* ==========================================================
       STATUS
    ========================================================== */

    let statusTimer = null;


    function showStatus(
      message,
      type = "success"
    ) {

      statusMessage.textContent =
        message;

      statusMessage.className = "";

      statusMessage.classList.add(
        type === "success"
          ? "success"
          : "error-status"
      );


      if (statusTimer) {

        clearTimeout(
          statusTimer
        );

      }


      statusTimer =
        setTimeout(() => {

          statusMessage.classList.add(
            "hidden"
          );

        }, 3500);

    }


    /* ==========================================================
       LOGIN
    ========================================================== */

    async function checkSession() {

      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();


      if (session) {

        await enterAdmin(
          session
        );

      } else {

        showLogin();

      }

    }


    /* ==========================================================
       MOSTRAR LOGIN
    ========================================================== */

    function showLogin() {

      loginScreen.classList.remove(
        "hidden"
      );

      adminScreen.classList.add(
        "hidden"
      );

    }


    /* ==========================================================
       ENTRAR NO ADMIN
    ========================================================== */

    async function enterAdmin(
      session
    ) {

      loginScreen.classList.add(
        "hidden"
      );

      adminScreen.classList.remove(
        "hidden"
      );


      userEmail.textContent =
        session.user.email || "";


      await loadSettings();

      await loadScreens();

    }


    /* ==========================================================
       LOGIN
    ========================================================== */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        loginError.classList.add(
          "hidden"
        );


        loginButton.disabled =
          true;


        loginButton.textContent =
          "ENTRANDO...";


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });


        if (error) {

          loginError.textContent =
            "E-mail ou senha incorretos.";

          loginError.classList.remove(
            "hidden"
          );


          loginButton.disabled =
            false;

          loginButton.textContent =
            "ENTRAR";


          return;

        }


        await enterAdmin(
          data.session
        );


        loginButton.disabled =
          false;


        loginButton.textContent =
          "ENTRAR";

      }
    );


    /* ==========================================================
       LOGOUT
    ========================================================== */

    logoutButton.addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        showLogin();

      }
    );


    /* ==========================================================
       CARREGAR CONFIGURAÇÕES
    ========================================================== */

    async function loadSettings() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("configuracoes")
          .select("*")
          .order("id", {
            ascending: true
          })
          .limit(1)
          .maybeSingle();


      if (error) {

        showStatus(
          "Erro ao carregar configurações: " +
          error.message,
          "error"
        );

        return;

      }


      if (!data) {

        showStatus(
          "Nenhuma configuração encontrada.",
          "error"
        );

        return;

      }


      document.getElementById(
        "intervalo"
      ).value =
        data.intervalo_powerbi ?? 150;


      document.getElementById(
        "reload"
      ).value =
        data.reload_horas ?? 4;


      document.getElementById(
        "mensagem"
      ).value =
        data.mensagem ?? "";


      document.getElementById(
        "calendario"
      ).checked =
        data.calendario ?? true;


      document.getElementById(
        "relogio"
      ).checked =
        data.relogio ?? true;

    }


    /* ==========================================================
       SALVAR CONFIGURAÇÕES
    ========================================================== */

    document
      .getElementById("save-settings")
      .addEventListener(
        "click",
        saveSettings
      );


    async function saveSettings() {

      const intervalo =
        parseInt(
          document
            .getElementById("intervalo")
            .value,
          10
        );


      const reload =
        parseInt(
          document
            .getElementById("reload")
            .value,
          10
        );


      const mensagem =
        document
          .getElementById("mensagem")
          .value
          .trim();


      const calendario =
        document
          .getElementById("calendario")
          .checked;


      const relogio =
        document
          .getElementById("relogio")
          .checked;


      /* =========================
         VALIDAÇÃO
      ========================= */

      if (
        !intervalo ||
        intervalo < 5
      ) {

        showStatus(
          "O intervalo mínimo é 5 segundos.",
          "error"
        );

        return;

      }


      if (
        !reload ||
        reload < 1
      ) {

        showStatus(
          "O reload mínimo é 1 hora.",
          "error"
        );

        return;

      }


      /* =========================
         LOCALIZAR CONFIGURAÇÃO
      ========================= */

      const {
        data: existing,
        error: selectError
      } =
        await supabaseClient
          .from("configuracoes")
          .select("id")
          .order("id", {
            ascending: true
          })
          .limit(1)
          .maybeSingle();


      if (selectError) {

        showStatus(
          "Erro ao localizar configuração: " +
          selectError.message,
          "error"
        );

        return;

      }


      let result;


      /* =========================
         ATUALIZAR
      ========================= */

      if (existing) {

        result =
          await supabaseClient
            .from("configuracoes")
            .update({

              intervalo_powerbi:
                intervalo,

              reload_horas:
                reload,

              mensagem:
                mensagem,

              calendario:
                calendario,

              relogio:
                relogio

            })
            .eq(
              "id",
              existing.id
            );


      } else {


        /* =========================
           CRIAR
        ========================= */

        result =
          await supabaseClient
            .from("configuracoes")
            .insert({

              intervalo_powerbi:
                intervalo,

              reload_horas:
                reload,

              mensagem:
                mensagem,

              calendario:
                calendario,

              relogio:
                relogio

            });

      }


      /* =========================
         VERIFICAR ERRO
      ========================= */

      if (result.error) {

        showStatus(
          "Erro ao salvar: " +
          result.error.message,
          "error"
        );

        return;

      }


      showStatus(
        "Configurações salvas com sucesso!"
      );


      /*
       * Recarrega os dados do banco
       * para confirmar que foram salvos.
       */

      await loadSettings();

    }


    /* ==========================================================
       CARREGAR TELAS
    ========================================================== */

    async function loadScreens() {

      screenList.innerHTML =
        '<div class="empty">Carregando telas...</div>';


      const {
        data,
        error
      } =
        await supabaseClient
          .from("telas_powerbi")
          .select("*")
          .order("ordem", {
            ascending: true
          });


      if (error) {

        screenList.innerHTML =
          '<div class="empty">Erro ao carregar telas.</div>';


        showStatus(
          "Erro: " +
          error.message,
          "error"
        );


        return;

      }


      if (
        !data ||
        data.length === 0
      ) {

        screenList.innerHTML =
          '<div class="empty">Nenhuma tela cadastrada.</div>';


        return;

      }


      screenList.innerHTML =
        "";


      data.forEach(
        screen => {

          createScreenRow(
            screen
          );

        }
      );

    }


    /* ==========================================================
       CRIAR LINHA DE TELA
    ========================================================== */

    function createScreenRow(
      screen
    ) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "screen-row" +
        (
          !screen.ativo
            ? " inactive"
            : ""
        );


      row.dataset.id =
        screen.id;


      row.innerHTML = `

        <div class="screen-order">
          #${screen.ordem ?? ""}
        </div>

        <div class="screen-field">

          <label>
            NOME
          </label>

          <input
            type="text"
            class="screen-name"
          >

        </div>

        <div class="screen-field">

          <label>
            URL POWER BI
          </label>

          <input
            type="text"
            class="screen-url"
          >

        </div>

        <div class="screen-field">

          <label>
            ORDEM
          </label>

          <input
            type="number"
            class="screen-order-input"
            min="1"
            value="${screen.ordem ?? 1}"
          >

        </div>

        <div class="status-box">

          <input
            type="checkbox"
            class="screen-active"
            ${screen.ativo ? "checked" : ""}
          >

          <span>
            ATIVA
          </span>

        </div>

        <div class="screen-actions">

          <button
            class="btn-danger delete-screen">
            🗑️ Excluir
          </button>

        </div>

      `;


      /* =========================
         PREENCHER CAMPOS
      ========================= */

      row.querySelector(
        ".screen-name"
      ).value =
        screen.nome || "";


      row.querySelector(
        ".screen-url"
      ).value =
        screen.url || "";


      /* =========================
         CHECKBOX
      ========================= */

      const activeCheckbox =
        row.querySelector(
          ".screen-active"
        );


      activeCheckbox.addEventListener(
        "change",
        function() {

          row.classList.toggle(
            "inactive",
            !this.checked
          );

        }
      );


      /* =========================
         EXCLUIR
      ========================= */

      row
        .querySelector(
          ".delete-screen"
        )
        .addEventListener(
          "click",
          function() {

            deleteScreen(
              screen.id
            );

          }
        );


      screenList.appendChild(
        row
      );

    }


    /* ==========================================================
       SALVAR TELAS
    ========================================================== */

    document
      .getElementById("save-screens")
      .addEventListener(
        "click",
        saveScreens
      );


    async function saveScreens() {

      const rows =
        document.querySelectorAll(
          ".screen-row"
        );


      if (
        rows.length === 0
      ) {

        showStatus(
          "Não há telas para salvar.",
          "error"
        );

        return;

      }


      const updates = [];


      rows.forEach(
        row => {

          const id =
            row.dataset.id;


          const nome =
            row
              .querySelector(
                ".screen-name"
              )
              .value
              .trim();


          const url =
            row
              .querySelector(
                ".screen-url"
              )
              .value
              .trim();


          const ordem =
            parseInt(
              row
                .querySelector(
                  ".screen-order-input"
                )
                .value,
              10
            );


          const ativo =
            row
              .querySelector(
                ".screen-active"
              )
              .checked;


          updates.push({

            id,
            nome,
            url,
            ordem,
            ativo

          });

        }
      );


      /* =========================
         VALIDAÇÃO
      ========================= */

      for (
        const screen of updates
      ) {

        if (!screen.nome) {

          showStatus(
            "Todas as telas precisam ter um nome.",
            "error"
          );

          return;

        }


        if (!screen.url) {

          showStatus(
            "Todas as telas precisam ter uma URL.",
            "error"
          );

          return;

        }


        if (
          !screen.ordem ||
          screen.ordem < 1
        ) {

          showStatus(
            "A ordem precisa ser maior que zero.",
            "error"
          );

          return;

        }

      }


      /* =========================
         ATUALIZAR CADA TELA
      ========================= */

      for (
        const screen of updates
      ) {

        const {
          error
        } =
          await supabaseClient
            .from("telas_powerbi")
            .update({

              nome:
                screen.nome,

              url:
                screen.url,

              ordem:
                screen.ordem,

              ativo:
                screen.ativo

            })
            .eq(
              "id",
              screen.id
            );


        if (error) {

          showStatus(
            "Erro ao salvar tela: " +
            error.message,
            "error"
          );

          return;

        }

      }


      showStatus(
        "Telas salvas com sucesso!"
      );


      await loadScreens();

    }


    /* ==========================================================
       ADICIONAR TELA
    ========================================================== */

    document
      .getElementById("add-screen")
      .addEventListener(
        "click",
        addScreen
      );


    async function addScreen() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("telas_powerbi")
          .select("ordem")
          .order("ordem", {
            ascending: false
          })
          .limit(1)
          .maybeSingle();


      if (error) {

        showStatus(
          "Erro ao descobrir próxima ordem: " +
          error.message,
          "error"
        );

        return;

      }


      const nextOrder =
        data
          ? Number(data.ordem) + 1
          : 1;


      const {
        error: insertError
      } =
        await supabaseClient
          .from("telas_powerbi")
          .insert({

            nome:
              "Nova Tela",

            url:
              "",

            ordem:
              nextOrder,

            ativo:
              true

          });


      if (insertError) {

        showStatus(
          "Erro ao adicionar tela: " +
          insertError.message,
          "error"
        );

        return;

      }


      showStatus(
        "Nova tela adicionada."
      );


      await loadScreens();

    }


    /* ==========================================================
       EXCLUIR TELA
    ========================================================== */

    async function deleteScreen(
      id
    ) {

      const confirmed =
        confirm(
          "Tem certeza que deseja excluir esta tela?"
        );


      if (!confirmed) {

        return;

      }


      const {
        error
      } =
        await supabaseClient
          .from("telas_powerbi")
          .delete()
          .eq(
            "id",
            id
          );


      if (error) {

        showStatus(
          "Erro ao excluir: " +
          error.message,
          "error"
        );

        return;

      }


      showStatus(
        "Tela excluída."
      );


      await loadScreens();

    }


    /* ==========================================================
       MONITORAR LOGIN
    ========================================================== */

    supabaseClient.auth.onAuthStateChange(
      async (
        event,
        session
      ) => {

        if (session) {

          await enterAdmin(
            session
          );

        } else {

          showLogin();

        }

      }
    );


    /* ==========================================================
       INICIAR
    ========================================================== */

    checkSession();

  </script>

</body>
</html>
