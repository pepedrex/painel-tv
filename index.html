<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel Power BI TV</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Segoe UI", Arial, sans-serif;
      color: white;
    }

    iframe {
      width: calc(100vw - 280px);
      height: calc(100vh - 70px);
      border: none;
      display: block;
      margin-left: 280px;
    }

    /* === Barra inferior === */
    .ticker {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 70px;
      background: linear-gradient(to right, #003b7a, #007bff);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      border-top: 3px solid #00aaff;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.6);
      box-sizing: border-box;
      z-index: 10;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 1.15em;
      max-width: 75%;
      line-height: 1.3;
    }

    .left .live {
      background: #ff3131;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
      animation: piscar 1.2s infinite;
    }

    @keyframes piscar {
      0%, 50%, 100% {
        opacity: 1;
      }

      25%, 75% {
        opacity: 0.4;
      }
    }

    .headline {
      font-weight: 500;
      white-space: normal;
      line-height: 1.3;
      display: block;
    }

    .right {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 1.15em;
      font-weight: 600;
      padding-right: 10px;
      color: #e6f2ff;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
    }

    .icon {
      font-size: 1.2em;
      margin-right: 4px;
      opacity: 0.9;
    }

    /* === Barra lateral === */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 280px;
      height: calc(100vh - 70px);
      background: linear-gradient(to bottom, #002b5c, #004c9a);
      border-right: 3px solid #00aaff;
      box-shadow: 2px 0 8px rgba(0,0,0,0.6);
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      z-index: 5;
    }

    .sidebar h2 {
      text-align: center;
      font-size: 1.3em;
      color: #e6f2ff;
      margin-bottom: 15px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
      font-size: 1em;
    }

    .calendar div {
      padding: 6px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    .calendar .today {
      background: #00aaff;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 0 8px rgba(0, 170, 255, 0.7);
    }

    .calendar .holiday {
      background: #ff3131;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 0 8px rgba(255, 49, 49, 0.7);
    }

    .holiday-note {
      margin-top: 20px;
      font-size: 1em;
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 6px;
      text-align: center;
    }

    /* === Mensagem de carregamento/erro === */
    #status {
      position: fixed;
      top: 50%;
      left: calc(50% + 140px);
      transform: translate(-50%, -50%);
      z-index: 20;
      color: white;
      background: rgba(0, 0, 0, 0.85);
      padding: 20px 30px;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      display: none;
    }
  </style>
</head>

<body>

  <div class="sidebar" id="sidebar">
    <h2 id="month-year"></h2>

    <div
      class="calendar"
      id="calendar">
    </div>

    <div
      class="holiday-note"
      id="holiday-note">
    </div>
  </div>


  <iframe
    id="frame"
    allowfullscreen
    title="Painel Power BI">
  </iframe>


  <div id="status"></div>


  <div class="ticker">

    <div class="left">

      <div class="live">
        ATENÇÃO
      </div>

      <div
        class="headline"
        id="headline">
        Carregando mensagem...
      </div>

    </div>


    <div
      class="right"
      id="clock-container">

      <div>

        <span class="icon">
          🕒
        </span>

        <span id="clock">
          --:--
        </span>

      </div>

    </div>

  </div>


  <script>

    /* =========================================================
       SUPABASE
    ========================================================= */

    const SUPABASE_URL =
      "https://rgfcgdbtzsmidxllfqpx.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_dLvwDfNc_0D3kykWgus6sg_9ssB5Ng2";


    /* =========================================================
       ELEMENTOS
    ========================================================= */

    const iframe =
      document.getElementById("frame");

    const status =
      document.getElementById("status");

    const sidebar =
      document.getElementById("sidebar");

    const headline =
      document.getElementById("headline");

    const clockContainer =
      document.getElementById("clock-container");

    const clock =
      document.getElementById("clock");

    const calendar =
      document.getElementById("calendar");

    const monthYear =
      document.getElementById("month-year");

    const holidayNote =
      document.getElementById("holiday-note");


    /* =========================================================
       VARIÁVEIS
    ========================================================= */

    let telas = [];

    let indiceAtual = 0;

    let configuracaoAtual = null;

    let rotationTimer = null;

    let reloadTimer = null;


    /* =========================================================
       STATUS
    ========================================================= */

    function mostrarStatus(mensagem) {

      status.innerHTML = mensagem;

      status.style.display = "block";

    }


    function esconderStatus() {

      status.style.display = "none";

    }


    /* =========================================================
       BUSCAR DADOS DO SUPABASE
    ========================================================= */

    async function supabaseGet(endpoint) {

      const resposta =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/" +
          endpoint,
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY,
              "Accept":
                "application/json"
            }
          }
        );


      if (!resposta.ok) {

        const texto =
          await resposta.text();

        throw new Error(
          "Supabase " +
          resposta.status +
          ": " +
          texto
        );

      }


      return await resposta.json();

    }


    /* =========================================================
       CARREGAR CONFIGURAÇÕES
    ========================================================= */

    async function carregarConfiguracoes() {

      try {

        const dados =
          await supabaseGet(
            "configuracoes" +
            "?select=id,intervalo_powerbi,reload_horas,mensagem,calendario,relogio" +
            "&limit=1"
          );


        if (
          !Array.isArray(dados) ||
          dados.length === 0
        ) {

          throw new Error(
            "Nenhuma configuração encontrada."
          );

        }


        const novaConfiguracao =
          dados[0];


        const intervaloAnterior =
          configuracaoAtual
            ? Number(
                configuracaoAtual.intervalo_powerbi
              )
            : null;


        const reloadAnterior =
          configuracaoAtual
            ? Number(
                configuracaoAtual.reload_horas
              )
            : null;


        const intervaloAtual =
          Number(
            novaConfiguracao.intervalo_powerbi
          );


        const reloadAtual =
          Number(
            novaConfiguracao.reload_horas
          );


        configuracaoAtual =
          novaConfiguracao;


        /* =====================================================
           MENSAGEM
        ===================================================== */

        headline.textContent =
          novaConfiguracao.mensagem ||
          "";


        /* =====================================================
           CALENDÁRIO
        ===================================================== */

        if (novaConfiguracao.calendario) {

          sidebar.style.display = "flex";

          iframe.style.marginLeft = "280px";

          iframe.style.width =
            "calc(100vw - 280px)";

        } else {

          sidebar.style.display = "none";

          iframe.style.marginLeft = "0";

          iframe.style.width =
            "100vw";

        }


        /* =====================================================
           RELÓGIO
        ===================================================== */

        if (novaConfiguracao.relogio) {

          clockContainer.style.display =
            "flex";

        } else {

          clockContainer.style.display =
            "none";

        }


        /* =====================================================
           ROTAÇÃO
        ===================================================== */

        if (
          intervaloAnterior === null ||
          intervaloAnterior !== intervaloAtual
        ) {

          iniciarRotacao();

        }


        /* =====================================================
           RELOAD
        ===================================================== */

        if (
          reloadAnterior === null ||
          reloadAnterior !== reloadAtual
        ) {

          iniciarReload();

        }


        console.log(
          "Configurações carregadas:",
          novaConfiguracao
        );

      } catch (erro) {

        console.error(
          "Erro ao carregar configurações:",
          erro
        );

        /*
         * Não derruba a TV se o Supabase
         * estiver temporariamente indisponível.
         */

      }

    }


    /* =========================================================
       CARREGAR TELAS
    ========================================================= */

    async function carregarTelas() {

      try {

        mostrarStatus(
          "Carregando telas..."
        );


        const dados =
          await supabaseGet(
            "telas_powerbi" +
            "?select=id,nome,url,ordem,ativo" +
            "&ativo=eq.true" +
            "&order=ordem.asc"
          );


        if (
          !Array.isArray(dados) ||
          dados.length === 0
        ) {

          throw new Error(
            "Nenhuma tela ativa foi encontrada."
          );

        }


        telas =
          dados
            .filter(tela =>
              tela.url &&
              tela.url.trim() !== ""
            )
            .sort((a, b) =>
              Number(a.ordem) -
              Number(b.ordem)
            );


        if (telas.length === 0) {

          throw new Error(
            "Nenhuma tela possui uma URL válida."
          );

        }


        console.log(
          "Telas carregadas:",
          telas
        );


        indiceAtual = 0;


        iframe.src =
          telas[indiceAtual].url;


        console.log(
          "Abrindo:",
          telas[indiceAtual].nome
        );


        esconderStatus();


        iniciarRotacao();


      } catch (erro) {

        console.error(
          "Erro ao carregar telas:",
          erro
        );


        mostrarStatus(
          "Não foi possível carregar as telas do Power BI.<br><br>" +
          "Verifique o Supabase e as URLs."
        );

      }

    }


    /* =========================================================
       INICIAR ROTAÇÃO
    ========================================================= */

    function iniciarRotacao() {

      if (rotationTimer) {

        clearInterval(
          rotationTimer
        );

        rotationTimer = null;

      }


      if (!configuracaoAtual) {

        return;

      }


      if (telas.length <= 1) {

        return;

      }


      const segundos =
        Number(
          configuracaoAtual.intervalo_powerbi
        );


      if (
        !Number.isFinite(segundos) ||
        segundos <= 0
      ) {

        console.error(
          "Intervalo inválido:",
          segundos
        );

        return;

      }


      console.log(
        "Rotação configurada para:",
        segundos,
        "segundos"
      );


      rotationTimer =
        setInterval(
          proximaTela,
          segundos * 1000
        );

    }


    /* =========================================================
       PRÓXIMA TELA
    ========================================================= */

    function proximaTela() {

      if (telas.length <= 1) {

        return;

      }


      indiceAtual++;


      if (
        indiceAtual >= telas.length
      ) {

        indiceAtual = 0;

      }


      const telaAtual =
        telas[indiceAtual];


      console.log(
        "Trocando para:",
        telaAtual.nome
      );


      iframe.src =
        telaAtual.url;

    }


    /* =========================================================
       RELOAD AUTOMÁTICO
    ========================================================= */

    function iniciarReload() {

      if (reloadTimer) {

        clearTimeout(
          reloadTimer
        );

        reloadTimer = null;

      }


      if (!configuracaoAtual) {

        return;

      }


      const horas =
        Number(
          configuracaoAtual.reload_horas
        );


      if (
        !Number.isFinite(horas) ||
        horas <= 0
      ) {

        console.error(
          "Tempo de reload inválido:",
          horas
        );

        return;

      }


      console.log(
        "Reload configurado para:",
        horas,
        "horas"
      );


      reloadTimer =
        setTimeout(
          () => {

            location.reload();

          },
          horas *
          60 *
          60 *
          1000
        );

    }


    /* =========================================================
       RELÓGIO
    ========================================================= */

    function atualizarHora() {

      const agora =
        new Date();


      const horas =
        agora
          .getHours()
          .toString()
          .padStart(2, "0");


      const minutos =
        agora
          .getMinutes()
          .toString()
          .padStart(2, "0");


      clock.textContent =
        `${horas}:${minutos}`;

    }


    setInterval(
      atualizarHora,
      1000
    );


    atualizarHora();


    /* =========================================================
       CALENDÁRIO
    ========================================================= */

    function montarCalendario() {

      calendar.innerHTML = "";


      const hoje =
        new Date();


      const mes =
        hoje.getMonth();


      const ano =
        hoje.getFullYear();


      const monthNames = [
        "Janeiro",
        "Fevereiro",
        "Março",
        "Abril",
        "Maio",
        "Junho",
        "Julho",
        "Agosto",
        "Setembro",
        "Outubro",
        "Novembro",
        "Dezembro"
      ];


      monthYear.textContent =
        `${monthNames[mes]} ${ano}`;


      const firstDay =
        new Date(
          ano,
          mes,
          1
        ).getDay();


      const lastDate =
        new Date(
          ano,
          mes + 1,
          0
        ).getDate();


      /*
       * Mantido conforme seu calendário atual.
       * Dia 12 é o destaque vermelho.
       */

      const holidayDay = 12;


      for (
        let i = 0;
        i < firstDay;
        i++
      ) {

        const empty =
          document.createElement("div");

        calendar.appendChild(
          empty
        );

      }


      for (
        let day = 1;
        day <= lastDate;
        day++
      ) {

        const div =
          document.createElement("div");


        div.textContent =
          day;


        if (
          day === hoje.getDate()
        ) {

          div.classList.add(
            "today"
          );

        }


        if (
          day === holidayDay
        ) {

          div.classList.add(
            "holiday"
          );

        }


        calendar.appendChild(
          div
        );

      }


      holidayNote.textContent =
        `Dia ${holidayDay} teste de marcação de data.`;

    }


    /* =========================================================
       VERIFICAR ALTERAÇÕES DO ADMIN
    ========================================================= */

    async function verificarConfiguracoes() {

      await carregarConfiguracoes();

    }


    /*
     * Verifica o Supabase a cada 30 segundos.
     *
     * Assim, se você alterar:
     *
     * 150 → 30 segundos
     *
     * a TV passa a usar 30 segundos.
     */

    setInterval(
      verificarConfiguracoes,
      30000
    );


    /* =========================================================
       INICIALIZAÇÃO
    ========================================================= */

    async function iniciarPainel() {

      montarCalendario();


      /*
       * Primeiro carrega as configurações.
       */

      await carregarConfiguracoes();


      /*
       * Depois carrega as telas.
       */

      await carregarTelas();

    }


    iniciarPainel();

  </script>

</body>
</html>
